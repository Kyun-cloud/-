<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>장비 출고 리스트</title>

<style>
* { box-sizing: border-box; }

body {
    font-family: Arial, sans-serif;
    margin: 20px;
    background: #f5f5f5;
    color: #222;
}

h1 { text-align: center; }
h2 { margin: 0 0 10px; font-size: 18px; }

.panel {
    background: white;
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 20px;
}

/* 거래처 정보 */
.header-box label {
    display: block;
    font-weight: bold;
    margin-bottom: 5px;
}
.header-box input[type="text"] {
    width: 100%;
    padding: 8px;
    margin-bottom: 12px;
}

/* 툴바 */
.toolbar {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
}
.toolbar .grow { flex: 1 1 200px; display: flex; gap: 8px; }
.toolbar input[type="text"] { flex: 1; padding: 8px; }

/* 카테고리 카드 */
#board {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 20px;
    margin-bottom: 20px;
}
.category {
    background: white;
    border-radius: 10px;
    padding: 15px;
}
.cat-head {
    display: flex;
    gap: 6px;
    align-items: center;
    margin-bottom: 10px;
}
.cat-name {
    flex: 1;
    min-width: 0;
    font-size: 17px;
    font-weight: bold;
    border: 1px solid transparent;
    padding: 4px 6px;
    border-radius: 6px;
    background: transparent;
}
.cat-name:hover, .cat-name:focus { border-color: #ccc; background: #fafafa; }

.item {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 6px;
}
.item input[type="checkbox"] { flex: none; }
.item-name {
    flex: 1;
    min-width: 0;
    border: 1px solid transparent;
    padding: 4px 6px;
    border-radius: 6px;
    background: transparent;
    font-size: 14px;
}
.item-name:hover, .item-name:focus { border-color: #ccc; background: #fafafa; }
.item input[type="number"] { width: 58px; padding: 4px; }

.add-row {
    display: flex;
    gap: 6px;
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed #ddd;
}
.add-row input { flex: 1; min-width: 0; padding: 6px; }

.empty-note { color: #999; font-size: 13px; margin: 4px 0; }
.hint { color: #777; font-size: 13px; margin: 0 0 12px; }

button {
    padding: 8px 12px;
    cursor: pointer;
    border: 1px solid #bbb;
    background: #fff;
    border-radius: 6px;
}
button:hover { background: #f0f0f0; }
button.primary { background: #222; color: white; border-color: #222; }
button.primary:hover { background: #444; }
button.danger { color: #c0392b; }
button.danger.confirming { background: #c0392b; color: white; border-color: #c0392b; }
button.small { padding: 4px 8px; }

.buttons { display: flex; flex-direction: column; gap: 8px; }
.buttons button { width: 100%; padding: 10px; }

#printArea { white-space: pre-wrap; font-size: 14px; }

/* ===== 인쇄용 스타일 ===== */
@media print {
    body { background: white; margin: 0; }
    h1, .header-box, .setup, #board, .buttons { display: none !important; }
    .result { padding: 0; }
    #printArea { font-size: 12pt; line-height: 1.6; }
}
</style>
</head>

<body>

<h1>장비 출고 리스트</h1>

<div class="panel header-box">
    <label for="projectName">프로젝트명</label>
    <input type="text" id="projectName" placeholder="예: 유튜브 촬영">
</div>

<div class="panel setup">
    <h2>장비 목록 관리</h2>
    <p class="hint">카테고리와 장비를 직접 추가·수정·삭제할 수 있어요. 이름을 클릭하면 바로 수정돼요. 변경 내용은 이 브라우저에 자동 저장돼요.</p>
    <div class="toolbar">
        <div class="grow">
            <input type="text" id="newCategory" placeholder="새 카테고리 이름 (예: 조명)">
            <button class="primary" id="addCategoryBtn">카테고리 추가</button>
        </div>
        <button id="clearQtyBtn">수량 모두 0으로</button>
        <button id="exportBtn">목록 내보내기</button>
        <button id="importBtn">목록 불러오기</button>
        <button class="danger" id="resetBtn">기본 목록으로 초기화</button>
        <input type="file" id="importFile" accept=".json,application/json" hidden>
    </div>
</div>

<div id="board"></div>

<div class="panel result">
    <h2>출고표</h2>
    <div id="printArea"></div>
</div>

<div class="panel buttons">
    <button class="primary" id="generateBtn">리스트 생성</button>
    <button id="printBtn">PDF / 인쇄</button>
</div>

<script>
const STORAGE_KEY = "equipmentListData_v1";

/* ---------- 기본 데이터 ---------- */
function defaultData() {
    return [
        { name: "카메라", items: ["ARRI ALEXA Mini", "Sony FX3"] },
        { name: "렌즈", items: ["Cooke S4 Set"] },
        { name: "삼각대", items: ["Sachtler Tripod"] },
        { name: "필터", items: ["ND Filter Set"] },
        { name: "음향", items: ["Zoom F6 Recorder", "Wireless Mic Set"] },
        { name: "그립장비", items: ["C-Stand"] }
    ].map(c => ({
        id: uid(),
        name: c.name,
        items: c.items.map(n => ({ id: uid(), name: n, qty: 0 }))
    }));
}

function uid() {
    return Math.random().toString(36).slice(2, 10);
}

/* ---------- 상태 + 저장 ---------- */
let state = load();

function load() {
    try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
            const parsed = JSON.parse(raw);
            if (isValid(parsed)) return parsed;
        }
    } catch (e) { /* 저장소를 못 쓰는 환경이면 무시 */ }
    return defaultData();
}

function save() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) { /* 저장 실패해도 동작은 계속 */ }
}

function isValid(data) {
    return Array.isArray(data) && data.every(c =>
        c && typeof c.name === "string" && Array.isArray(c.items) &&
        c.items.every(i => i && typeof i.name === "string")
    );
}

// 불러온 데이터의 id/수량 보정
function normalize(data) {
    return data.map(c => ({
        id: c.id || uid(),
        name: c.name,
        items: c.items.map(i => ({
            id: i.id || uid(),
            name: i.name,
            qty: Math.max(0, Math.floor(Number(i.qty) || 0))
        }))
    }));
}

/* ---------- 렌더링 ---------- */
const board = document.getElementById("board");

function render() {
    board.innerHTML = "";

    if (state.length === 0) {
        const p = document.createElement("p");
        p.className = "empty-note";
        p.textContent = "카테고리가 없어요. 위에서 카테고리를 추가해 주세요.";
        board.appendChild(p);
        return;
    }

    state.forEach(cat => board.appendChild(buildCategory(cat)));
}

function buildCategory(cat) {
    const card = document.createElement("div");
    card.className = "category";
    card.dataset.catId = cat.id;

    // 헤더: 이름 + 삭제
    const head = document.createElement("div");
    head.className = "cat-head";

    const nameInput = document.createElement("input");
    nameInput.type = "text";
    nameInput.className = "cat-name";
    nameInput.value = cat.name;
    nameInput.setAttribute("aria-label", "카테고리 이름");
    nameInput.addEventListener("change", () => {
        const v = nameInput.value.trim();
        if (!v) { nameInput.value = cat.name; return; }
        cat.name = v;
        save();
    });

    const delBtn = document.createElement("button");
    delBtn.className = "danger small";
    delBtn.textContent = "삭제";
    delBtn.addEventListener("click", () => confirmClick(delBtn, () => {
        state = state.filter(c => c.id !== cat.id);
        save();
        render();
    }));

    head.appendChild(nameInput);
    head.appendChild(delBtn);
    card.appendChild(head);

    // 장비 목록
    if (cat.items.length === 0) {
        const p = document.createElement("p");
        p.className = "empty-note";
        p.textContent = "장비가 없어요.";
        card.appendChild(p);
    }
    cat.items.forEach(item => card.appendChild(buildItem(cat, item)));

    // 장비 추가
    const addRow = document.createElement("div");
    addRow.className = "add-row";

    const addInput = document.createElement("input");
    addInput.type = "text";
    addInput.placeholder = "장비 이름 추가";

    const addBtn = document.createElement("button");
    addBtn.textContent = "추가";

    const doAdd = () => {
        const v = addInput.value.trim();
        if (!v) return;
        cat.items.push({ id: uid(), name: v, qty: 0 });
        save();
        render();
        // 방금 쓰던 카테고리의 입력창에 포커스 유지
        const again = board.querySelector('[data-cat-id="' + cat.id + '"] .add-row input');
        if (again) again.focus();
    };
    addBtn.addEventListener("click", doAdd);
    addInput.addEventListener("keydown", e => {
        if (e.key === "Enter" && !e.isComposing) doAdd();
    });

    addRow.appendChild(addInput);
    addRow.appendChild(addBtn);
    card.appendChild(addRow);

    return card;
}

function buildItem(cat, item) {
    const row = document.createElement("div");
    row.className = "item";

    const checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = item.qty > 0;

    const nameInput = document.createElement("input");
    nameInput.type = "text";
    nameInput.className = "item-name";
    nameInput.value = item.name;
    nameInput.setAttribute("aria-label", "장비 이름");

    const qty = document.createElement("input");
    qty.type = "number";
    qty.min = "0";
    qty.value = item.qty;
    qty.setAttribute("aria-label", "수량");

    const del = document.createElement("button");
    del.className = "danger small";
    del.textContent = "✕";
    del.title = "장비 삭제";

    // 체크박스 → 수량
    checkbox.addEventListener("change", () => {
        item.qty = checkbox.checked ? Math.max(1, item.qty) : 0;
        qty.value = item.qty;
        save();
    });

    // 수량 → 체크박스
    qty.addEventListener("input", () => {
        item.qty = Math.max(0, Math.floor(Number(qty.value) || 0));
        checkbox.checked = item.qty > 0;
        save();
    });

    // 이름 수정
    nameInput.addEventListener("change", () => {
        const v = nameInput.value.trim();
        if (!v) { nameInput.value = item.name; return; }
        item.name = v;
        save();
    });

    // 삭제
    del.addEventListener("click", () => {
        cat.items = cat.items.filter(i => i.id !== item.id);
        save();
        render();
    });

    row.appendChild(checkbox);
    row.appendChild(nameInput);
    row.appendChild(qty);
    row.appendChild(del);
    return row;
}

// 버튼을 두 번 눌러야 실행되는 확인 방식 (prompt/confirm 대신)
function confirmClick(btn, action) {
    if (btn.classList.contains("confirming")) {
        action();
        return;
    }
    const original = btn.textContent;
    btn.classList.add("confirming");
    btn.textContent = "정말 삭제?";
    setTimeout(() => {
        if (btn.isConnected) {
            btn.classList.remove("confirming");
            btn.textContent = original;
        }
    }, 3000);
}

/* ---------- 카테고리 추가 ---------- */
const newCategoryInput = document.getElementById("newCategory");

function addCategory() {
    const v = newCategoryInput.value.trim();
    if (!v) return;
    state.push({ id: uid(), name: v, items: [] });
    newCategoryInput.value = "";
    save();
    render();
}
document.getElementById("addCategoryBtn").addEventListener("click", addCategory);
newCategoryInput.addEventListener("keydown", e => {
    if (e.key === "Enter" && !e.isComposing) addCategory();
});

/* ---------- 도구 버튼 ---------- */
document.getElementById("clearQtyBtn").addEventListener("click", () => {
    state.forEach(c => c.items.forEach(i => i.qty = 0));
    save();
    render();
});

const resetBtn = document.getElementById("resetBtn");
resetBtn.addEventListener("click", () => confirmClick(resetBtn, () => {
    state = defaultData();
    save();
    render();
    resetBtn.classList.remove("confirming");
    resetBtn.textContent = "기본 목록으로 초기화";
}));

// 내보내기 / 불러오기 (백업, 다른 PC로 옮길 때 사용)
document.getElementById("exportBtn").addEventListener("click", () => {
    const blob = new Blob([JSON.stringify(state, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "equipment_list.json";
    document.body.appendChild(a);
    a.click();
    a.remove();
    URL.revokeObjectURL(url);
});

const importFile = document.getElementById("importFile");
document.getElementById("importBtn").addEventListener("click", () => importFile.click());
importFile.addEventListener("change", () => {
    const file = importFile.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
        try {
            const parsed = JSON.parse(reader.result);
            if (!isValid(parsed)) throw new Error("형식 오류");
            state = normalize(parsed);
            save();
            render();
        } catch (e) {
            alert("올바른 장비 목록 파일이 아니에요.");
        }
        importFile.value = "";
    };
    reader.readAsText(file);
});

/* ---------- 출고표 생성 ---------- */
function generateList() {
    const project = document.getElementById("projectName").value.trim() || "-";

    let result = "■ 프로젝트 : " + project + "\n\n";

    let hasItems = false;

    state.forEach(cat => {
        const picked = cat.items.filter(i => i.qty > 0);
        if (picked.length === 0) return;
        hasItems = true;
        result += "[" + cat.name + "]\n";
        picked.forEach(i => { result += "- " + i.name + " x " + i.qty + "\n"; });
        result += "\n";
    });

    if (!hasItems) result += "(선택된 장비가 없습니다)\n";

    document.getElementById("printArea").innerText = result;
}

function printList() {
    generateList();
    window.print();
}

document.getElementById("generateBtn").addEventListener("click", generateList);
document.getElementById("printBtn").addEventListener("click", printList);

/* ---------- 시작 ---------- */
render();
</script>

</body>
</html>
